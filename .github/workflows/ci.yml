name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests, ML reproducibility and restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run complete verification against disposable databases
        run: bash scripts/check_ml.sh
  local-stack:
    name: Build and start the documented Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/init_env.py
      - run: docker compose -f compose.local.yml up -d --build --wait --wait-timeout 180
      - name: Check site, API protection and session lifecycle
        run: python3 scripts/check_local_stack.py
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs --tail=80
      - name: Clean up
        if: always()
        run: docker compose -f compose.local.yml down -v
