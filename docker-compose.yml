services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: migrate/migrate:v4.19.1

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_NAME}?sslmode=disable",
        "up"
      ]

    restart: "no"

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    environment:

      HTTP_ADDR: ":8080"

      POSTGRES_HOST: postgres

      REDIS_ADDR: redis:6379

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:

    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}

    depends_on:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:

    image: postgres:16-alpine

    restart: unless-stopped

    env_file:
      - .env

    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}

    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - backup_data:/backups

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: ["sh", "/backup.sh"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:

  postgres_data:

  redis_data:

  caddy_data:

  caddy_config:

  backup_data: